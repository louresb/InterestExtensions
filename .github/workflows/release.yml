name: Publish NuGet

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    name: Validate release artifact
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: |
            InterestExtension/packages.lock.json
            InterestExtension.Tests/packages.lock.json

      - name: Verify tag matches package version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected a stable vMAJOR.MINOR.PATCH tag, got $RELEASE_TAG"
            exit 1
          }

          tag_version="${RELEASE_TAG#v}"
          project_version="$(dotnet msbuild InterestExtension/InterestExtension.csproj -nologo -getProperty:PackageVersion | tr -d '\r')"

          [[ "$tag_version" == "$project_version" ]] || {
            echo "Tag version $tag_version does not match package version $project_version"
            exit 1
          }

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Verify tagged commit is on main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "The release tag must point to a commit contained in main."
            exit 1
          }

      - name: Restore dependencies
        run: dotnet restore InterestExtension.sln --locked-mode

      - name: Build
        run: dotnet build InterestExtension.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test InterestExtension.sln --configuration Release --no-build

      - name: Pack and validate
        run: dotnet pack InterestExtension/InterestExtension.csproj --configuration Release --no-build --no-restore -p:ContinuousIntegrationBuild=true --output artifacts/packages

      - name: Restore package smoke test
        run: dotnet restore InterestExtension.PackageSmoke/InterestExtension.PackageSmoke.csproj --packages artifacts/smoke-packages --source artifacts/packages

      - name: Test installed package on .NET 8
        run: dotnet run --project InterestExtension.PackageSmoke/InterestExtension.PackageSmoke.csproj --framework net8.0 --no-restore -- artifacts/packages

      - name: Test installed package on .NET 10
        run: dotnet run --project InterestExtension.PackageSmoke/InterestExtension.PackageSmoke.csproj --framework net10.0 --no-restore -- artifacts/packages

      - name: Upload validated release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: InterestExtensions-${{ steps.version.outputs.version }}
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    name: Publish to NuGet.org
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: nuget.org
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Download validated release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: InterestExtensions-${{ needs.validate.outputs.version }}
          path: artifacts/packages

      - name: Verify downloaded package files
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          test -f "artifacts/packages/InterestExtensions.$VERSION.nupkg"
          test -f "artifacts/packages/InterestExtensions.$VERSION.snupkg"

      - name: Authenticate to NuGet.org
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish package
        env:
          PACKAGE_PATH: artifacts/packages/InterestExtensions.${{ needs.validate.outputs.version }}.nupkg
        run: dotnet nuget push "$PACKAGE_PATH" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
